[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-app-security-lab"
version = "0.1.0"
description = "Reproducible synthetic-data experiments for LLM application security"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pypdf>=6,<7",
    "qdrant-client>=1.19.0",
]

[project.scripts]
llm-security-lab = "llm_security_lab.cli:main"
llm-security-report = "llm_security_lab.report:main"
llm-security-authority = "llm_security_lab.authority_cli:main"
llm-security-authority-report = "llm_security_lab.authority_report_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_security_lab"]

[dependency-groups]
dev = [
  "pillow>=12.1,<13",
  "pytest>=9,<10",
  "ruff>=0.15,<0.16",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
