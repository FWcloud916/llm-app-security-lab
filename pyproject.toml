[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-app-security-lab"
version = "0.1.0"
description = "Reproducible synthetic-data experiments for LLM application security"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "nemoguardrails>=0.23,<0.24",
    "pypdf>=6,<7",
    "qdrant-client>=1.19.0",
]

[project.scripts]
llm-security-lab = "llm_security_lab.cli:main"
llm-security-report = "llm_security_lab.report:main"
llm-security-authority = "llm_security_lab.authority_cli:main"
llm-security-authority-report = "llm_security_lab.authority_report_cli:main"
llm-security-agency = "llm_security_lab.agency_cli:main"
llm-security-agency-report = "llm_security_lab.agency_report_cli:main"
llm-security-tool-boundary = "llm_security_lab.tool_boundary_cli:main"
llm-security-tool-boundary-report = "llm_security_lab.tool_boundary_report_cli:main"
llm-security-supply-chain = "llm_security_lab.supply_chain_cli:main"
llm-security-supply-chain-report = "llm_security_lab.supply_chain_report_cli:main"
llm-security-agent-chain = "llm_security_lab.agent_chain_cli:main"
llm-security-agent-chain-report = "llm_security_lab.agent_chain_report_cli:main"
llm-security-output-boundary = "llm_security_lab.output_boundary_cli:main"
llm-security-output-boundary-report = "llm_security_lab.output_boundary_report_cli:main"
llm-security-guardrails = "llm_security_lab.guardrails_cli:main"
llm-security-guardrails-report = "llm_security_lab.guardrails_report_cli:main"
llm-security-prompt-guard = "llm_security_lab.prompt_guard_cli:main"
llm-security-prompt-guard-report = "llm_security_lab.prompt_guard_report_cli:main"
llm-security-sandbox = "llm_security_lab.sandboxing_cli:main"
llm-security-sandbox-report = "llm_security_lab.sandboxing_report_cli:main"
llm-security-pii = "llm_security_lab.pii_cli:main"
llm-security-pii-report = "llm_security_lab.pii_report_cli:main"
llm-security-observability = "llm_security_lab.observability_cli:main"
llm-security-observability-report = "llm_security_lab.observability_report_cli:main"
llm-security-cost-controls = "llm_security_lab.cost_controls_cli:main"
llm-security-cost-controls-report = "llm_security_lab.cost_controls_report_cli:main"
llm-security-red-team = "llm_security_lab.red_teaming_cli:main"
llm-security-red-team-report = "llm_security_lab.red_teaming_report_cli:main"

[project.optional-dependencies]
prompt-guard = [
    "torch>=2.2,<3",
    "transformers>=4.44,<5",
]
pii = [
    "en-core-web-sm",
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
]
observability = [
    "opentelemetry-sdk>=1.39,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_security_lab"]

[dependency-groups]
dev = [
  "pillow>=12.1,<13",
  "pytest>=9,<10",
  "ruff>=0.15,<0.16",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
